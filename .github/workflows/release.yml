name: release
on:
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No '## $v (date)' section in CHANGELOG.md"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.notes.outputs.version }}" --title "v${{ steps.notes.outputs.version }}" --notes-file notes.md
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          v="${{ steps.notes.outputs.version }}"
          text=$(printf '*Zevero sales skills v%s is out* :rocket:\n%s\n\nUpdate with `claude plugin update`. <%s/releases/tag/v%s|Full notes> · Ask Claude "request a skill" to suggest the next one.' \
            "$v" "$(sed 's/^- /• /' notes.md)" "${{ github.server_url }}/${{ github.repository }}" "$v")
          jq -n --arg t "$text" '{text:$t}' | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
